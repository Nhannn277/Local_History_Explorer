version: '3.8'
services:
  minio:
    image: minio/minio
    restart: always
    ports:
      - 9000:9000
      - 9001:9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - 5173:5173
    depends_on:
      - minio
    volumes:
      - ./backend:/app
    environment:
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=local-history
      - MINIO_USE_SSL=false

  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: always
    env_file:
      - ./frontend/.env.local
    ports:
      - 3000:3000
    depends_on:
      - backend-dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true

volumes:
  minio_data:
  backend_data:
  frontend_data:
